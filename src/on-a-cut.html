const dirty=new Set(); let flushing=false, flushT=0;
function touch(key){ // key: "settings" or a date

async function flush(){
  if(flushing||!col) return; flushing=true;
  try{ while(dirty.size){ const key=dirty.values().next().value; dirty.delete(key);
      const o=key==="settings"?S.settings:S.days[key]; if(!o) continue;
      try{ await col.doc(key).set(JSON.parse(JSON.stringify(o))) }
      catch(e){ if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,1500+Math.random()*1500)); try{await col.doc(key).set(JSON.parse(JSON.stringify(o)))}catch(e2){setCloud("off");return} }
                else { setCloud("off"); return } } }
  } finally{ flushing=false }
}
function setCloud(s){cloud=s; if(s==="off") col=null; const el=document.getElementById("sync"); if(el){el.className="sync"+(s==="on"?" on":"");el.textContent=syncLabel()}}
const syncLabel=()=>cloud==="on"?"云端已同步":"仅本机保存";
async function pull(){
  if(!col) return;
  const snap=await Promise.race([col.limit(1000).get(),new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),10000))]);
  let changed=false; const seen=new Set();
  snap.docs.forEach(d=>{ const data=d.data(); if(!data) return; seen.add(d.id);
    const copy=JSON.parse(JSON.stringify(data));
    if(d.id==="settings"){ if((copy.updatedAt||0)>(S.settings.updatedAt||0)){S.settings=Object.assign(defaults(),copy);changed=true} else if((S.settings.updatedAt||0)>(copy.updatedAt||0)) dirty.add("settings") }
    else if(/^\d{4}-\d{2}-\d{2}$/.test(d.id)){ const loc=S.days[d.id];
      if(!loc||(copy.updatedAt||0)>(loc.updatedAt||0)){S.days[d.id]=copy;changed=true} else if((loc.updatedAt||0)>(copy.updatedAt||0)) dirty.add(d.id) } });
  if(S.settings.updatedAt&&!seen.has("settings")) dirty.add("settings");
  Object.keys(S.days).forEach(k=>{ if(!seen.has(k)) dirty.add(k) });
  if(changed){saveLocal();render()}
  if(dirty.size) flush();
}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use) return;
    window.claude.use("sample").then(f=>{sampleFn=f||null}).catch(()=>{});
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return; const id=await user.id(); if(!id) return;
    col=db.collection("data/users/"+id);
    await pull(); setCloud("on");
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&col) pull().catch(()=>{}) });
  }catch(e){ col=null; setCloud("local") }
}

function gauge(name,v,lo,hi,col,unit,floor,isPro){

  return `<div class="g" style="--col:var(--${col})"><div class="g-top"><span class="g-name">${name}</span>
   <span class="g-val"><b>${r0(v)}</b> / ${lo}–${hi} ${unit}</span><span class="g-st ${cls}">${st}</span></div>
   <div class="tape" role="img" aria-label="${name} ${r0(v)}${unit}，目标 ${lo} 到 ${hi}">
   <i class="fill" style="width:${pct(v)}%"></i><i class="band" style="left:${pct(lo)}%;width:${pct(hi)-pct(lo)}%"></i>
   ${floor?`<i class="floor" style="left:${pct(floor)}%"></i>`:""}</div></div>`;
}
function nextHint(day,date,T,t,ws){
  const needP=Math.max(0,(t.p[0]+t.p[1])/2-T.p), roomC=t.c[1]-T.c, roomK=t.k[1]-T.k, roomF=t.f[1]-T.f;
  if(!day.entries.length) return `<div class="hint">${date>today()?"提前排好这一天：照下面的参考餐单填入，再换成你想吃的。":"今天还没记录。"}${day.state==="C"?"休息日把主食控制在 <b>3–4 拳</b>，蛋白照旧。":"练后第一餐吃最大的一份：<b>1 掌瘦肉 + 2 拳主食 + 两捧菜</b>。"}</div>`;
  if(ws.closed&&T.p<t.pf) return `<div class="hint warn"><b>蛋白质低于底线 ${t.pf}g。</b>底线优先于断食窗口：现在水冲 1 大勺蛋白粉（约 23g），不算破戒。</div>`;
  const parts=[];
  if(needP>8){const palms=half(needP/30)||0.5; parts.push(`蛋白还差约 <b>${r0(needP)}g</b> ≈ <b>${palms} 掌瘦肉</b>${needP<=28?" 或 1 大勺蛋白粉":""}`)}
  else parts.push("蛋白质已到位");
  const fists=Math.max(0,half(Math.min(roomC/33,(roomK-needP*5)/140)));
  if(fists>=0.5) parts.push(`主食还能吃 <b>${fists} 拳</b>`); else parts.push("主食额度已用完，剩下用蔬菜撑饱");
  if(roomF<5) parts.push("脂肪见顶，后面蒸煮不加油");
  const warn=roomK<-60;
  if(warn) parts.push(`热量超出约 <b>${r0(-roomK)} kcal</b>，去“对冲”页看摊平方案`);
  return `<div class="hint${warn?" warn":""}">${parts.join("；")}。</div>`;
}
function mealNote(day,i,mt,es){

    return w.length?["warn",w.join("；")+"。"]:["good","✓ 份量合适。"] }
  if(mt.p<25) w.push(`蛋白只有 ${r0(mt.p)}g，再加半掌肉或 1 个蛋`);
  else if(mt.p>45) w.push(`蛋白 ${r0(mt.p)}g 偏多，可挪一部分到下一餐`);
  if(i===1&&day.state!=="C"&&mt.c<50) w.push("练后这餐碳水偏少，可再加 1 拳主食");

}

function hedgePlan(day,extra){
  const t=targets(day.state), T=totals(day); T.p+=extra.p;T.c+=extra.c;T.f+=extra.f;T.k+=kcalOf(extra);
  const needP=Math.max(0,t.p[0]-T.p), por=needP<=8?0:needP<=38?1:2, dinnerK=por*145+90;
  const remC=t.c[1]-T.c, remF=t.f[1]-T.f, remK=t.k[1]-T.k;
  const fl=Math.max(0,Math.floor(Math.min(remC/33,(remK-dinnerK)/140)*2)/2);
  const over=Math.max(0,-(remK-dinnerK-fl*140));
  return {remC,remF,remK,fl,por,over,days:Math.min(5,Math.max(2,Math.ceil(over/80)))};
}

function weekDates(d){const dt=parseD(d),wd=(dt.getDay()+6)%7,mon=addDays(d,-wd);return Array.from({length:7},(_,i)=>addDays(mon,i))}
function weightSeries(){return Object.keys(S.days).filter(k=>S.days[k].weight>0).sort().map(k=>({d:k,w:S.days[k].weight}))}
function chart(ser){
  if(!ser.length) return '<div class="empty">记下第一个晨起体重后，这里会画出每日体重和 7 日均线。</div>';
  const W=320,H=150,L=34,R=8,Tp=10,B=22, d0=ser[0].d, span=Math.max(6,diffDays(ser[ser.length-1].d,d0));
  const ws=ser.map(s=>s.w), lo=Math.floor((Math.min(...ws)-0.3)*2)/2, hi=Math.ceil((Math.max(...ws)+0.3)*2)/2;
  const x=d=>L+diffDays(d,d0)/span*(W-L-R), y=w=>Tp+(hi-w)/(hi-lo)*(H-Tp-B);
  const avg=ser.map((s,i)=>{const win=ser.filter(q=>diffDays(s.d,q.d)>=0&&diffDays(s.d,q.d)<7);return {d:s.d,w:win.reduce((a,q)=>a+q.w,0)/win.length}});
  const ticks=[lo,(lo+hi)/2,hi];
  const last=avg[avg.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="体重趋势图">
   ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end">${v.toFixed(1)}</text>`).join("")}
   <text x="${L}" y="${H-5}">${d0.slice(5).replace("-","/")}</text><text x="${W-R}" y="${H-5}" text-anchor="end">${addDays(d0,span).slice(5).replace("-","/")}</text>
   ${ser.map(s=>`<circle cx="${x(s.d)}" cy="${y(s.w)}" r="2.6" fill="var(--muted)" opacity=".55"/>`).join("")}
   <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${avg.map(a=>x(a.d)+","+y(a.w)).join(" ")}"/>
   <circle cx="${x(last.d)}" cy="${y(last.w)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></svg>
   <div class="small muted">灰点：每日体重　绿线：7 日均重</div>`;
}
function weightStats(ser){
  const td=today(), avgIn=(a,b)=>{const xs=ser.filter(s=>{const n=diffDays(td,s.d);return n>=a&&n<b}).map(s=>s.w);return xs.length?xs.reduce((p,q)=>p+q,0)/xs.length:null};
  const a1=avgIn(0,7), a0=avgIn(7,14), w0=S.settings.weight0;
  let verdict="连续记 2 周晨重后，这里会判断减重速度是否合适。";
  if(a1!=null&&a0!=null){const rate=a0-a1;
    if(rate>0.7) verdict=`每周 −${rate.toFixed(2)} kg，<b>偏快</b>，容易掉肌肉。训练日加回 1 拳主食。`;
    else if(rate>=0.25) verdict=`每周 −${rate.toFixed(2)} kg，<b>速度正好</b>（目标 0.3–0.6 kg/周），保持。`;
    else if(rate>-0.15) verdict=`本周基本持平。先核对烹调油和零食有没有漏记；连续 2 周持平再把每天主食减半拳，或日均多走 2000 步。`;
    else verdict=`本周均重上升 ${(-rate).toFixed(2)} kg。先看是否经期、高盐或睡眠差引起的水分波动，再看记录是否完整。`}
  return `<div class="stats"><div><b>${a1!=null?a1.toFixed(1):"–"}</b><span>近 7 日均重 kg</span></div>
   <div><b>${a1!=null?(a1-w0>0?"+":"")+(a1-w0).toFixed(1):"–"}</b><span>较起始 ${w0} kg</span></div>
   <div><b>${a1!=null&&a0!=null?(a1-a0>0?"+":"")+(a1-a0).toFixed(2):"–"}</b><span>较上周 kg</span></div></div>
   <div class="hint">${verdict}</div>`;
}

function aiBrief(){

  return `# 个人刷脂交接档案（优化版）
身体：起始 ${s.weight0} kg / 163.5 cm；目标 30 天刷脂、减脂保肌（周期起始 ${s.start}）。预期每周 −0.3~0.6 kg，以 7 日均重判断。

训练日：蛋白 ${tr.p[0]}–${tr.p[1]}g（底线 ${tr.pf}g）、碳水 ${tr.c[0]}–${tr.c[1]}g、脂肪 ${tr.f[0]}–${tr.f[1]}g、${tr.k[0]}–${tr.k[1]} kcal。
休息日：蛋白 ${re.p[0]}–${re.p[1]}g、碳水 ${re.c[0]}–${re.c[1]}g、脂肪 ${re.f[0]}–${re.f[1]}g、${re.k[0]}–${re.k[1]} kcal。
规则：蛋白底线优先于断食窗口；每餐蛋白 25–40g，分 3 餐；碳水集中在练后第一餐。
计量（必须用实物单位回答）：1 掌瘦肉≈30g 蛋白；1 拳主食≈33g 碳水；1/3 根法棍≈45g 碳水，半根≈70g；Bulk 蛋白粉 1 大勺≈23g 蛋白（牛奶另计）；无糖豆浆粉 1 袋≈6g 蛋白；蔬菜两捧起、少油不限量。
甜点对冲：不批评，直接给当晚方案。先保蛋白，再从主食和油里腾额度；额度用完则当晚主食归零（1 掌瘦肉或水冲 1 勺蛋白粉 + 两捧蔬菜）；仍超出的部分用之后 2–4 天各少半拳主食摊平，不加练。
练前担心低血糖可吃半根香蕉或 1 片吐司。

最近 7 天记录：
${rows||"（暂无）\n"}`;

    <tr><td>米饭 / 杂粮 / 紫薯</td><td>1 拳，熟重 100–130g</td><td class="n">30–35g 碳水</td></tr>
    <tr><td>法棍</td><td>1/3 根（手掌长 80g）/ 半根</td><td class="n">45g / 70g 碳水</td></tr>
    <tr><td>Bulk 蛋白粉</td><td>1 大勺，水冲</td><td class="n">22–25g 蛋白</td></tr>
    <tr><td>无糖豆浆粉</td><td>1 袋</td><td class="n">6g 蛋白</td></tr>
    <tr><td>蔬菜</td><td>两双手捧起，少油</td><td class="n">不限量</td></tr>
    <tr><td>烹调油</td><td>1 茶匙 5g</td><td class="n">5g 脂肪</td></tr></table></div></details>
   <details><summary>什么时候调整</summary><ul>
    <li>7 日均重每周掉超过 0.7 kg：训练日加 1 拳主食。</li>
    <li>连续 2 周持平且记录完整：每天少半拳主食，或日均多走 2000 步。二选一，不叠加。</li>
    <li>连续几天睡不好、训练没劲、总想吃甜：先连续 2 天吃到维持热量（每天多 2 拳主食），再回到计划。</li>
    <li>30 天结束后用 1–2 周把主食每周加回 1 拳，回到维持量，再决定是否进入下一轮。</li>
    <li>经期前后体重上浮 0.5–1.5 kg 属正常水分波动，看均线不看单日。</li></ul>
    <p class="muted small">以上为一般性健康建议，热量目标按常见公式估算。如有基础疾病、月经紊乱或持续乏力，请先咨询医生或注册营养师。</p></details>
  </section>
  <section class="panel"><h2>设置</h2>
   <div class="grid2"><label class="field">周期开始日<input id="st-start" data-set="start" type="date" value="${s.start}"></label>
    <label class="field">起始体重 kg<input id="st-w0" data-set="weight0" type="number" inputmode="decimal" step="0.1" value="${s.weight0}"></label></div>
   <h3>每周默认安排</h3><div class="grid4">${planSel}</div>
   ${trow("train","训练日额度")}${trow("rest","休息日额度")}
  </section>
  <section class="panel"><h2>交给 AI / 备份</h2>
   <p class="muted small" style="margin:0">复制后粘贴给任意 AI，就能带着最新规则和近 7 天记录继续聊餐食评估。</p>
   <div class="row"><button class="btn primary grow" data-act="copyai">复制 AI 交接档案</button><button class="btn" data-act="export">导出备份</button></div>
   <textarea class="inp" id="io" placeholder="导出的备份会出现在这里；换设备时把备份粘贴进来再点“导入”。" aria-label="备份数据"></textarea>
   <div class="row"><button class="btn" data-act="import">导入备份</button><span class="muted small grow">${cloud==="on"?"数据已保存到你的 Claude 账号，换手机打开同一链接即可。":"数据目前只保存在这台设备的浏览器里，建议定期导出。"}</span></div>
  </section>`;
}

/* ---------- render + events ---------- */
const NAV=[["today","今天",'<path d="M4 11h16M6 11a6 6 0 0 0 12 0M12 5v2M8 4.5v2M16 4.5v2M9 20h6"/>'],
 ["hedge","对冲",'<path d="M12 4v16M5 8h14M5 8l-2.5 6a3 3 0 0 0 5 0L5 8zM19 8l-2.5 6a3 3 0 0 0 5 0L19 8zM8 20h8"/>'],
 ["log","记录",'<path d="M3 12h2m14 0h2M6 8v8M18 8v8M9 6v12M15 6v12M9 12h6"/>'],
 ["guide","准则",'<path d="M6 4h10a2 2 0 0 1 2 2v14H8a2 2 0 0 1-2-2V4zM6 16h12M9.5 8h5M9.5 11.5h5"/>']];
function render(){
  const app=document.getElementById("app");
  app.innerHTML=tab==="today"?viewToday():tab==="hedge"?viewHedge():tab==="log"?viewLog():viewGuide();
  document.getElementById("nav").innerHTML=NAV.map(n=>`<button data-tab="${n[0]}" ${tab===n[0]?'aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${n[2]}</svg>${n[1]}</button>`).join("");
}
let toastT=0;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},1600)}
function addFood(f,q,m){mut(cur,d=>{const ex=d.entries.find(e=>e.fid===f.id&&e.m===m); if(ex) ex.q=r1(ex.q+q); else {const e={id:uid(),fid:f.id,n:f.n,q:q,p:f.p,c:f.c,f:f.f,m:m,s:f.cat==="sweet"?1:0};if(f.k!=null)e.k=f.k;d.entries.push(e)}})}
function copyText(txt,okMsg){const fb=()=>{const io=document.getElementById("io");if(io){io.value=txt;io.focus();io.select();toast("已放入下方文本框，请长按复制")}};
  try{navigator.clipboard.writeText(txt).then(()=>toast(okMsg),fb)}catch(e){fb()}}

document.addEventListener("click",ev=>{
  const tb=ev.target.closest("[data-tab]"); if(tb){tab=tb.dataset.tab;try{localStorage.setItem(LS+".tab",tab)}catch(e){};render();window.scrollTo(0,0);return}
  const b=ev.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act, v=b.dataset.v;
  if(a==="prev"){cur=addDays(cur,-1)} else if(a==="next"){if(cur<addDays(today(),7))cur=addDays(cur,1)}
  else if(a==="state"){mut(cur,d=>{d.state=v})}
  else if(a==="meal"){meal=+v} else if(a==="cat"){cat=v;myEdit=false}
  else if(a==="add"){const f=findFood(v);if(!f)return;addFood(f,1,meal);toast("已记录 "+f.n)}
  else if(a==="inc"||a==="dec"){mut(cur,d=>{const e=d.entries.find(x=>x.id===v);if(!e)return;e.q=r1(e.q+(a==="inc"?0.5:-0.5));if(e.q<=0)d.entries=d.entries.filter(x=>x.id!==v)})}
  else if(a==="tpl"){TPL[dayOf(cur).state].forEach(m=>m[3].forEach(it=>addFood(FBY[it[0]],it[1],m[1])));toast("已填入，按实际增减")}
  else if(a==="est"){estimate();return}
  else if(a==="cuopen"){cu.open=true;if(!cu.n)cu.n=cu.q.trim()}
  else if(a==="custom"){const n=String(cu.n).trim(),g=x=>Math.max(0,parseFloat(x)||0);
    const p=g(cu.p),c=g(cu.c),f=g(cu.f),k=String(cu.k).trim()===""?null:r0(g(cu.k)); if(!n||!(p+c+f+(k||0))){toast("填上名称，以及热量或至少一项克数");return}
    const nm=n.slice(0,40), my=S.settings.my||(S.settings.my=[]); let item=my.find(x=>x.n===nm);
    if(!item){item={id:"my-"+uid(),cat:"my",n:nm};my.unshift(item);if(my.length>60)my.length=60}
    item.p=p;item.c=c;item.f=f; if(k!=null)item.k=k; else delete item.k; touch("settings");
    addFood(item,1,meal);cu=cuBlank();toast("已记录，并存入“常吃”")}
  else if(a==="myedit"){myEdit=!myEdit}
  else if(a==="mydel"){S.settings.my=(S.settings.my||[]).filter(x=>x.id!==v);touch("settings")}
  else if(a==="water"){mut(cur,d=>{d.water=Math.max(0,Math.min(16,(d.water||0)+ +v))})}
  else if(a==="hz"){hz={id:hz.id===v?null:v,q:1}} else if(a==="hzq"){hz.q=Math.max(0.5,r1(hz.q+ +v))}
  else if(a==="hzclear"){hz={id:null,q:1}}
  else if(a==="hzadd"){const f=FOODS.find(x=>x.id===hz.id);if(f){addFood(f,hz.q,4);hz={id:null,q:1};toast("已记入今天")}}
  else if(a==="lift"||a==="cardio"){mut(cur,d=>{d[a]=!d[a]})}
  else if(a==="copyai"){copyText(aiBrief(),"已复制，粘贴给 AI 即可");return}
  else if(a==="export"){copyText(JSON.stringify(S),"备份已复制");const io=document.getElementById("io");io.value=JSON.stringify(S);return}
  else if(a==="import"){try{const o=JSON.parse(document.getElementById("io").value);if(!o||!o.settings||!o.days)throw 0;
      S.settings=Object.assign(defaults(),o.settings);S.days=o.days;touch("settings");Object.keys(S.days).forEach(k=>touch(k));toast("已导入")}catch(e){toast("备份内容不完整，请粘贴完整的导出文本");return}}
  render();
});
document.addEventListener("input",ev=>{const m=/^cu-([qnpcfk])$/.exec(ev.target.id||""); if(m){cu[m[1]]=ev.target.value;const k=document.getElementById("cu-k");if(k)k.placeholder=cuAuto()}});
document.addEventListener("keydown",ev=>{ if(ev.key==="Enter"&&ev.target.id==="cu-q"){ev.preventDefault();estimate()} });
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.dataset.chg){const k=el.dataset.chg;
    if(k==="note"){mut(cur,d=>{d.note=el.value.slice(0,2000)});return}
    const n=parseFloat(el.value); mut(cur,d=>{if(n>0)d[k]=r1(n);else delete d[k]}); render(); return}
  if(el.dataset.set){const path=el.dataset.set.split(".");
    if(path.length===1){ if(path[0]==="start"){if(/^\d{4}-\d{2}-\d{2}$/.test(el.value))S.settings.start=el.value} else {const n=parseFloat(el.value);if(n>0)S.settings.weight0=r1(n)} }
    else{const n=parseFloat(el.value); if(n>0) S.settings.t[path[0]][path[1]][+path[2]]=r0(n)}
    touch("settings"); toast("已保存"); return}
  if(el.dataset.plan!=null){S.settings.plan[+el.dataset.plan]=el.value;touch("settings");toast("已保存")}
});
setInterval(()=>{ if(tab!=="today"||cur!==today()) return; const p=document.getElementById("winpill"); if(!p) return;
  const ws=winStatus(dayOf(cur),cur); p.textContent=ws.txt; p.className="pill "+(ws.cls==="open"?"open":"") },30000);

render();
initCloud();
})();
</script>
