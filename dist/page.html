<title>On a Cut 刷脂助手</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: phone-first single column, fixed bottom tab bar; macro gauges drawn as measuring tapes with a target band. */
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --sunk:#E4E9E5; --ink:#17211E; --muted:#5F6C67; --line:#D5DCD7;
  --accent:#0C6A5B; --on-accent:#FFFFFF; --accent-soft:#D8EBE6;
  --pro:#B32E4E; --carb:#B97A08; --fat:#2F66AE; --kcal:#4A5551;
  --good:#23794C; --warn:#B4500F; --warn-soft:#F8E6D8;
  --num:"Barlow Semi Condensed","DIN Alternate","Helvetica Neue",Arial,sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101614; --surface:#19211E; --sunk:#222C28; --ink:#E7EDEA; --muted:#93A09A; --line:#2D3833;
  --accent:#54C7B1; --on-accent:#06231D; --accent-soft:#1D3A34;
  --pro:#F07F98; --carb:#E8B449; --fat:#82ADEA; --kcal:#AEB9B4;
  --good:#63C990; --warn:#F09A5B; --warn-soft:#3A281B; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101614; --surface:#19211E; --sunk:#222C28; --ink:#E7EDEA; --muted:#93A09A; --line:#2D3833;
  --accent:#54C7B1; --on-accent:#06231D; --accent-soft:#1D3A34;
  --pro:#F07F98; --carb:#E8B449; --fat:#82ADEA; --kcal:#AEB9B4;
  --good:#63C990; --warn:#F09A5B; --warn-soft:#3A281B; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px calc(84px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:16px}
h3{font-size:14px}
.muted{color:var(--muted)} .small{font-size:12.5px}

/* header */
.top{display:flex;align-items:center;gap:8px}
.top .date{flex:1;min-width:0}
.top .d1{font-family:var(--num);font-size:26px;font-weight:700;line-height:1.1;letter-spacing:.01em}
.top .d2{font-size:12.5px;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.sync{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px;white-space:nowrap}
.sync.on{color:var(--good);border-color:var(--good)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row > .grow{flex:1;min-width:0}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;min-height:44px;line-height:1.25;color:var(--muted)}
.seg button b{display:block;font-size:14px;color:inherit}
.seg button span{font-size:11.5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.slim button{min-height:36px;padding:6px 4px;font-size:13px}

/* window status */
.win{display:flex;align-items:center;gap:12px}
.win .clock{font-family:var(--num);font-size:22px;font-weight:600;white-space:nowrap}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--sunk);color:var(--muted)}
.pill.open{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* tape gauges */
.g{display:flex;flex-direction:column;gap:5px}
.g-top{display:flex;align-items:baseline;gap:8px}
.g-name{font-weight:600;width:3.2em;flex:none}
.g-val{flex:1;min-width:0;color:var(--muted);font-family:var(--num);font-size:14px}
.g-val b{font-size:22px;font-weight:700;color:var(--col)}
.g-st{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.g-st.good{color:var(--good)} .g-st.warn{color:var(--warn)}
.tape{position:relative;height:16px;border-radius:4px;background:var(--sunk);overflow:hidden}
.tape::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(5% - 1px),var(--line) calc(5% - 1px) 5%);opacity:.9;pointer-events:none}
.tape .fill{position:absolute;inset:0 auto 0 0;background:var(--col);border-radius:4px 0 0 4px;transition:width .25s}
.tape .band{position:absolute;top:0;bottom:0;border-inline:2px solid var(--ink);background:color-mix(in srgb,var(--ink) 12%,transparent);z-index:2}
.tape .floor{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--warn);z-index:2}
@media (prefers-reduced-motion: reduce){ .tape .fill{transition:none} }

.hint{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}
.hint.warn{background:var(--warn-soft)}
.hint b{color:var(--accent)} .hint.warn b{color:var(--warn)}

/* food chips */
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:54px}
.chip:active{background:var(--accent-soft)}
.chip .n{font-weight:600;font-size:14px;line-height:1.3}
.chip .m{font-family:var(--num);font-size:12.5px;color:var(--muted)}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.chip.del{border-color:var(--warn);border-style:dashed}
.chip.del .n{color:var(--warn)}
.mnote{font-size:13px;color:var(--muted);padding:2px 0 4px}
.mnote.good{color:var(--good)} .mnote.warn{color:var(--warn)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;min-height:36px;color:var(--muted);font-size:13.5px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* search results + my foods */
#sr,#catarea{display:flex;flex-direction:column;gap:12px}
.sr-list{display:flex;flex-direction:column}
.sr-i{padding:9px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.sr-i:first-child{border-top:0;padding-top:0}
.sr-h{display:flex;align-items:center;gap:8px;min-width:0}
.sr-h .n{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.star{flex:none;width:38px;height:38px;border:0;background:none;font-size:21px;line-height:1;color:var(--muted);border-radius:8px;padding:0}
.star[aria-pressed="true"]{color:var(--carb)}
.ps{display:flex;flex-wrap:wrap;gap:6px}
.pbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;min-height:38px;font-size:13.5px;text-align:left;max-width:100%;overflow-wrap:anywhere}
.pbtn:active{background:var(--accent-soft)}
.sr-tail{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.more{display:flex;flex-wrap:wrap;align-items:center;gap:0 6px}
.chip .n{overflow-wrap:anywhere}
.chip .acts{display:flex;gap:14px}
.frow{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);min-width:0}
.frow:first-child{border-top:0}
.fmain{flex:1;min-width:0;border:0;background:none;text-align:left;padding:8px 0;display:flex;flex-direction:column;gap:1px;min-height:48px}
.fmain b{font-size:14px;overflow-wrap:anywhere}
.fmain span{font-family:var(--num);font-size:12.5px;color:var(--muted)}
.cdrow .e-n{overflow-wrap:anywhere}

/* log */
.meal-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px}
.meal-h b{color:var(--ink)}
.entry{display:flex;align-items:center;gap:8px;padding:4px 0}
.entry .e-n{flex:1;min-width:0}
.entry .e-n div:first-child{font-weight:600;font-size:14px}
.entry .e-n .m{font-family:var(--num);font-size:12.5px;color:var(--muted)}
.step{display:flex;align-items:center;gap:2px;flex:none}
.step button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1}
.step .q{font-family:var(--num);font-weight:600;min-width:2.2em;text-align:center}
.step button.q{width:auto;min-width:2.6em;border:0;background:none;padding:0 4px;text-decoration:underline dotted;text-underline-offset:4px}
.qin{width:64px;min-height:34px;padding:4px 6px;text-align:center;font-family:var(--num);font-size:16px;font-weight:600;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--ink)}
.tbtn{border:0;background:none;padding:2px 4px;min-height:26px;color:var(--ink);font-family:var(--num);font-weight:600}
.tin{font-size:16px;padding:2px 6px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--ink);max-width:9em}
.cbrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0}
.cbrow .inp{flex:1 1 8em;width:auto}
.cbnew{text-align:right}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:10px 0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;min-height:42px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:40px;font-size:16px;color:var(--ink);width:100%;min-width:0}
textarea.inp{min-height:76px;resize:vertical;font-size:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* water + week */
.cups{display:flex;gap:5px;flex-wrap:wrap}
.cups i{width:22px;height:26px;border:1.5px solid var(--fat);border-radius:3px 3px 7px 7px;display:block}
.cups i.f{background:var(--fat)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week div{border:1px solid var(--line);border-radius:10px;padding:6px 0;text-align:center;font-size:12px;color:var(--muted)}
.week div b{display:block;font-family:var(--num);font-size:17px;color:var(--ink)}
.week div.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.week div.done b{color:var(--on-accent)}
.week div.today{outline:2px solid var(--ink);outline-offset:1px}
.cal{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.cal i{aspect-ratio:1;border-radius:6px;background:var(--sunk);display:grid;place-items:center;font-style:normal;font-family:var(--num);font-size:12.5px;color:var(--muted)}
.cal i.ok{background:var(--accent);color:var(--on-accent)}
.cal i.half{background:var(--accent-soft);color:var(--accent)}
.cal i.now{outline:2px solid var(--ink);outline-offset:1px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--sunk);border-radius:10px;padding:8px 10px}
.stats b{display:block;font-family:var(--num);font-size:22px;line-height:1.15}
.stats span{font-size:12px;color:var(--muted)}
svg text{font-family:var(--num);font-size:11px;fill:var(--muted)}

.chips.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--sunk);border-radius:12px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--num);font-size:34px;font-weight:700;line-height:1.05}
.tile .v small{font-family:var(--text);font-size:14px;font-weight:600;margin-left:2px}
.tile .s{font-size:12px;color:var(--muted);line-height:1.35}
.tile.zero{background:var(--warn-soft)} .tile.zero .v{color:var(--warn)}
.tile.go{background:var(--accent-soft)} .tile.go .v{color:var(--accent)}
.stats b.neg{color:var(--warn)}
.verdict{display:flex;flex-wrap:wrap;gap:6px}
.verdict .pill{font-size:13px;padding:4px 12px}
.pill.good{background:var(--accent-soft);color:var(--good)}
.link{border:0;background:none;padding:4px 0;color:var(--accent);font-weight:600;text-align:left;min-height:32px}
.est{display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:10px;padding:10px}
.est .field input{background:var(--surface)}

.tl{display:flex;flex-direction:column}
.tl .m{display:grid;grid-template-columns:3.4em minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.tl .m:first-child{border-top:0;padding-top:0}
.tl .t{font-family:var(--num);font-size:18px;font-weight:700}
.tl .w b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.tl .w span{font-size:14.5px;line-height:1.45}
.tl .pp{font-family:var(--num);font-size:13px;color:var(--pro);font-weight:600;white-space:nowrap}

/* guide */
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{font-weight:600;cursor:pointer;min-height:28px}
details ul{margin:8px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
details p{margin:8px 0 0}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:8px}
th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;white-space:nowrap}
td.n,th.n{font-family:var(--num);text-align:right}
.plan li{margin:0}
.plan{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav button{border:0;background:transparent;border-radius:10px;min-height:48px;color:var(--muted);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13.5px;z-index:50;max-width:90vw;display:flex;align-items:center;gap:12px;white-space:nowrap}
#toast span{overflow:hidden;text-overflow:ellipsis}
#toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0 2px;min-height:28px;flex:none}

/* hero + profile button */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero .k{font-size:12.5px;color:var(--muted);font-weight:600}
.hero .big{font-family:var(--num);font-size:48px;font-weight:700;line-height:1}
.hero .big small{font-family:var(--text);font-size:14px;font-weight:600;margin-left:4px;color:var(--muted)}
.hero .big.neg{color:var(--warn)}
.hero .r{text-align:right;font-family:var(--num);font-size:13.5px;color:var(--muted);line-height:1.5;min-width:0}
.hero .r .pill{font-family:var(--text);font-size:11.5px;margin-top:3px}
.icon-btn{position:relative;flex:none;display:grid;place-items:center;padding:0}
.icon-btn:disabled{opacity:.35}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .dot{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--warn);border:2px solid var(--surface)}
.bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

/* sheet */
body.lock{overflow:hidden}
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:94%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sh-h{display:flex;align-items:flex-start;gap:8px;padding:16px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.sh-b{overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:4px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.sh-f{display:flex;gap:8px;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sh-f .grow,.sh-h .grow{flex:1;min-width:0}
.dots{display:flex;gap:6px}
.dots i{width:26px;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--accent)}
.lab{font-size:12.5px;color:var(--muted);margin-bottom:5px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mode{display:flex;flex-direction:column;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:64px}
.mode b{font-size:15px}
.mode span{font-size:12.5px;color:var(--muted);line-height:1.35}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.err{color:var(--warn);font-size:13.5px;font-weight:600}
.err:empty{display:none}
.check{display:flex;align-items:center;gap:8px;font-size:14px;min-height:36px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.field input[type="file"]{font-size:13px;padding:8px}
</style>

<div id="app"></div>
<nav aria-label="主导航"><div class="in" id="nav"></div></nav>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
/* On a Cut 食物库：只有数据，无逻辑。浏览器里挂在 self.OnACutFoods，Node 里走 module.exports。

   u 份量（第一个是基准，x=1；其余按 x 倍换算，变体 id 为 <id>@<k>）；p/c/f 基准份量的蛋白 / 碳水 / 脂肪（g）；

/* ---------- hedge ---------- */
/* 结论 pill：T 已含预演的甜点，按它预演摊平，和点“吃了，记入”后之后几天实际扣的一致 */
function hzPill(T,a){const s=spreadOf(cur,T.k), k=r0(a.overK), on=S.settings.spread;
  if(s) return `<span class="pill warn">仍超 ${s.over} kcal → ${spreadText(s)}</span>`;
  if(a.overK>0) return !on?`<span class="pill warn">仍超 ${k} kcal</span>`:k<30?`<span class="pill">略超 ${k} kcal，不用管</span>`:`<span class="pill warn">吃完预计超 ${k} kcal → 记下后自动摊到之后几天</span>`;
  return `<span class="pill good">吃完全天仍在额度内</span>`}
function viewHedge(){
  const day=dayOf(cur), sel=hz.id?findFood(hz.id):null, t=tgtOf(cur), T=totals(day);
  if(sel){T.p+=sel.p*hz.q;T.c+=sel.c*hz.q;T.f+=sel.f*hz.q;T.k+=kcalOf(sel)*hz.q}
  const show=sel||day.entries.some(e=>e.s);
  /* 甜点分三组：内置按 g 分（g 不是 sweet 的都归饮品零食），自定义的单独一组；隐藏条目不列出。hzg 只在内存里 */
  const grp={sweet:FOODS.filter(f=>f.cat==="sweet"&&!f.hide&&f.g==="sweet"),snack:FOODS.filter(f=>f.cat==="sweet"&&!f.hide&&f.g!=="sweet"),my:S.settings.my.filter(f=>f.cat==="sweet")};
  if(!grp[hzg]||(hzg==="my"&&!grp.my.length)) hzg="sweet";
  const gtabs=[["sweet","甜点"],["snack","饮品零食"],["my","我的"]].filter(g=>g[0]!=="my"||grp.my.length).map(g=>`<button data-act="hzg" data-v="${g[0]}" aria-pressed="${hzg===g[0]}">${g[1]} ${grp[g[0]].length}</button>`).join("");
  const chips=grp[hzg].map(f=>`<button class="chip${hz.id===f.id?" sel":""}" data-act="hz" data-v="${f.id}"><span class="n">${esc(f.base?f.base.n:f.n)}</span><span class="m">${r0(kcalOf(f))} kcal</span></button>`).join("");
  let res='<div class="empty">点一款甜点，马上看到今晚怎么吃。</div>';
  if(show){const a=advise({T,t,mealsLeft:1,windowClosed:false,kOnly:kOnly(day)||(!!sel&&kOnlyE(sel))});
    const bud=(v,u,l)=>`<div><b class="${v<0?"neg":""}">${v<0?"超 ":""}${r0(Math.abs(v))}</b><span>${l}${v<0?"":"还剩"} ${u}</span></div>`;
    res=`${adviceTiles(a)}
     <div class="verdict">${hzPill(T,a)}
      ${a.flags.includes("kOnly")?'<span class="pill warn">部分食物只记了热量，仅供参考</span>':""}<span class="pill">蔬菜两捧</span><span class="pill">不加练，明早照常</span></div>
     <div class="stats">${bud(t.c[1]-T.c,"g","碳水")}${bud(t.f[1]-T.f,"g","脂肪")}${bud(a.budget,"kcal","热量")}</div>`}
  return `
  <header class="top"><div class="date"><div class="d1">甜点对冲</div><div class="d2">${dayLabel()} · ${stInfo(stOf(day)).t}</div></div>${profBtn()}</header>

     <div class="step"><button data-act="hzq" data-v="-0.5" aria-label="减半份">−</button><span class="q">×${hz.q}</span><button data-act="hzq" data-v="0.5" aria-label="加半份">+</button></div></div>

function weekDates(d){const dt=parseD(d),wd=(dt.getDay()+6)%7,mon=addDays(d,-wd);return Array.from({length:7},(_,i)=>addDays(mon,i))}
function weightSeries(){return Object.keys(S.days).filter(k=>S.days[k].weight>0).sort().map(k=>({d:k,w:S.days[k].weight}))}
function avgW(ser,a,b){const td=today(),xs=ser.filter(s=>{const n=diffDays(td,s.d);return n>=a&&n<b}).map(s=>s.w);return xs.length?xs.reduce((p,q)=>p+q,0)/xs.length:null}
function chart(ser){
  ser=ser.slice(-90);
  if(!ser.length) return '<div class="empty">记下第一个晨起体重后，这里会画出每日体重和 7 日均线。</div>';
  const W=320,H=150,L=34,R=8,Tp=10,B=22, d0=ser[0].d, span=Math.max(6,diffDays(ser[ser.length-1].d,d0));
  const ws=ser.map(s=>s.w), lo=Math.floor((Math.min(...ws)-0.3)*2)/2, hi=Math.ceil((Math.max(...ws)+0.3)*2)/2;
  const x=d=>L+diffDays(d,d0)/span*(W-L-R), y=w=>Tp+(hi-w)/(hi-lo)*(H-Tp-B);
  const avg=ser.map(s=>{const win=ser.filter(q=>diffDays(s.d,q.d)>=0&&diffDays(s.d,q.d)<7);return {d:s.d,w:win.reduce((a,q)=>a+q.w,0)/win.length}});
  const last=avg[avg.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="体重趋势图">
   ${[lo,(lo+hi)/2,hi].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end">${v.toFixed(1)}</text>`).join("")}
   <text x="${L}" y="${H-5}">${d0.slice(5).replace("-","/")}</text><text x="${W-R}" y="${H-5}" text-anchor="end">${addDays(d0,span).slice(5).replace("-","/")}</text>
   ${ser.map(s=>`<circle cx="${x(s.d)}" cy="${y(s.w)}" r="2.6" fill="var(--muted)" opacity=".55"/>`).join("")}
   <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${avg.map(a=>x(a.d)+","+y(a.w)).join(" ")}"/>
   <circle cx="${x(last.d)}" cy="${y(last.w)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></svg>
   <div class="small muted">灰点：每日体重　绿线：7 日均重</div>`;
}
function weightStats(ser){
  const pf=S.settings.profile||{}, a1=avgW(ser,0,7), a0=avgW(ser,7,14), w0=S.settings.weight0||+pf.w||0, goal=+pf.goal||0, mode=pf.mode||"cut1";
  let verdict="连续记 2 周晨重后，这里会判断体重变化速度是否合适。";
  if(a1!=null&&a0!=null){const loss=a0-a1, pct=loss/a0*100;
    if(mode==="keep") verdict=Math.abs(loss)<0.3?"体重稳定，<b>维持得很好</b>。":`本周${loss>0?"下降":"上升"} ${Math.abs(loss).toFixed(2)} kg。连续 2 周同方向再调整：每天${loss>0?"加":"减"}半拳主食。`;
    else if(mode==="bulk") verdict=loss<-0.4?`每周 +${(-loss).toFixed(2)} kg，<b>涨得偏快</b>，多出来的多半是脂肪。每天少半拳主食。`:loss<=-0.05?`每周 +${(-loss).toFixed(2)} kg，<b>速度正好</b>。`:"体重没涨。先确认吃够了目标热量，连续 2 周不涨再每天加 1 拳主食。";
    else if(pct>1) verdict=`每周 −${loss.toFixed(2)} kg，<b>偏快</b>，容易掉肌肉。训练日加回 1 拳主食。`;
    else if(pct>=0.3) verdict=`每周 −${loss.toFixed(2)} kg，<b>速度正好</b>（体重的 0.3–1%），保持。`;
    else if(loss>-0.15) verdict="本周基本持平。先核对烹调油和零食有没有漏记；连续 2 周持平再每天少半拳主食，或日均多走 2000 步。";
    else verdict=`本周均重上升 ${(-loss).toFixed(2)} kg。先看是否经期、高盐或睡眠差引起的水分波动，再看记录是否完整。`}
  let prog="";
  if(goal&&w0&&a1!=null&&Math.abs(w0-goal)>0.1){const done=Math.max(0,Math.min(1,(w0-a1)/(w0-goal)));
    prog=`<div><div class="sec-title small muted"><span>起始 ${w0} kg</span><span>目标 ${goal} kg</span></div><div class="bar"><i style="width:${r0(done*100)}%"></i></div><div class="small muted" style="margin-top:4px">已完成 ${r0(done*100)}%，还差 ${Math.abs(a1-goal).toFixed(1)} kg</div></div>`}
  const drift=pf.done&&a1!=null&&+pf.w>0&&Math.abs(a1-pf.w)>=1;
  return `<div class="stats"><div><b>${a1!=null?a1.toFixed(1):"–"}</b><span>近 7 日均重 kg</span></div>
   <div><b>${a1!=null&&w0?(a1-w0>0?"+":"")+(a1-w0).toFixed(1):"–"}</b><span>较起始 kg</span></div>
   <div><b>${a1!=null&&a0!=null?(a1-a0>0?"+":"")+(a1-a0).toFixed(2):"–"}</b><span>较上周 kg</span></div></div>
   ${prog}
   ${drift?`<div class="hint warn">体重已从档案里的 ${pf.w} kg 变为 <b>${a1.toFixed(1)} kg</b>，营养目标该跟着更新了。<br><button class="btn" data-act="syncw" style="margin-top:8px">${pf.custom?"更新档案体重":"用新体重重新计算目标"}</button></div>`:""}
   <div class="hint">${verdict}</div>`;
}

${s.fast?`进食窗口：训练日 ${s.win.A[0]}–${s.win.A[1]}，休息日 ${s.win.C[0]}–${s.win.C[1]}。蛋白底线优先于断食窗口。`:"不限制进食时间。"}

最近 7 天记录：
${rows||"（暂无）\n"}`;

  const io=document.getElementById("io"); if(io) io.value=txt; copyText(txt,"备份已复制，粘贴到备忘录里保存","io");
}
/* 整体替换数据：原来有、新数据里没有的日期写成空白日，带新时间戳，云端旧数据才不会被拉回来 */
function replaceAll(o){
  const oldKeys=Object.keys(S.days); adopt(o);
  oldKeys.forEach(k=>{ if(!S.days[k]) S.days[k]=blankDay(k) });
  touch("settings",true); Object.keys(S.days).forEach(k=>touch(k,true)); saveLocal();
}
const undoAt=()=>{const m=/^\{"at":(\d+)/.exec(lsGet("undo")||"");return m?+m[1]:0};
function undoFits(json){const old=lsGet("undo"), ok=lsSet("undo",json); if(old!=null) lsSet("undo",old); else lsDel("undo"); return ok}
function restoreData(){
  const btn=document.getElementById("btn-restore"), raw=(document.getElementById("io").value||"").trim(); let o;
  try{o=JSON.parse(raw); if(!o||typeof o.settings!=="object"||typeof o.days!=="object") throw 0}catch(e){shErr="备份内容不完整：请选择导出的 .json 文件，或粘贴完整的备份文本";document.getElementById("sh-err").textContent=shErr;return}
  if(!armed){armed=true;btn.textContent=RESTORE_ARMED;btn.classList.add("on");
    rsWarn=undoFits(JSON.stringify({at:Date.now(),data:S}))?"":"空间不足，这次恢复无法撤销"; document.getElementById("rs-warn").textContent=rsWarn; return}
  const saved=lsSet("undo",JSON.stringify({at:Date.now(),data:S})); if(!saved) lsDel("undo");
  replaceAll(o); closeSheet(); render(); toast(saved?"数据已恢复":"数据已恢复（这次无法撤销）");
  if(!onboarded()) openSheet("onb");
}
function unrestore(){
  const btn=document.getElementById("btn-unrestore");
  if(!armedU){armedU=true;btn.textContent=UNRESTORE_ARMED;btn.classList.add("on");return}
  let o; try{o=JSON.parse(lsGet("undo")).data; if(!o||typeof o.settings!=="object"||typeof o.days!=="object") throw 0}catch(e){lsDel("undo");closeSheet();toast("恢复前的数据读不出来，无法撤销");return}
  replaceAll(o); lsDel("undo"); closeSheet(); render(); toast("已撤销，回到恢复前的数据");
  if(!onboarded()) openSheet("onb");
}

document.addEventListener("click",ev=>{
  const tb=ev.target.closest("[data-tab]"); if(tb){tab=tb.dataset.tab;lsSet("tab",tab);qEdit=tEdit=cbDraft=null;render();window.scrollTo(0,0);return}
  const b=ev.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act, v=b.dataset.v;
  if(a==="undo"){doUndo();return}
  /* sheet actions: re-render the sheet only */
  if(a==="profile"){openSheet("prof");return}
  if(a==="shclose"){closeSheet();return}
  if(a==="foods"){openSheet("foods");return}
  if(a==="fav"){toggleFav(v); if(sheet==="foods") renderSheet(); else renderSR(); return}
  if(a==="fesel"){const f=S.settings.my.find(x=>x.id===v); fe=(fe&&fe.id===v)||!f?null:{id:f.id,n:f.n,p:f.p,c:f.c,f:f.f,k:f.k!=null?f.k:"",cat:f.cat,err:""}; renderSheet(); return}
  if(a==="fecat"){ if(fe){fe.cat=v;renderSheet()} return}
  if(a==="fesave"){ if(!fe) return; const my=S.settings.my, it=my.find(x=>x.id===fe.id), g=x=>Math.max(0,Math.min(5000,r1(parseFloat(x)||0))), nm=String(fe.n).trim().slice(0,40);
    if(!it){fe=null;renderSheet();return}
    fe.err=!nm?"请填写名称":my.some(x=>x!==it&&x.n===nm)?"已经有同名的食物了":!CAT_IDS.includes(fe.cat)?"请选择分类":"";
    if(fe.err){renderSheet();return}
    it.n=nm;it.p=g(fe.p);it.c=g(fe.c);it.f=g(fe.f);it.cat=fe.cat;it.s=fe.cat==="sweet"?1:0; if(String(fe.k).trim()==="") delete it.k; else it.k=r0(g(fe.k));
    touch("settings"); fe=null; renderSheet(); toast("已保存"); return}
  if(a==="fedel"){ if(!fe) return; const id=fe.id, it=S.settings.my.find(x=>x.id===id); fe=null;
    if(it) withUndo("settings","已删除 "+it.n,()=>{const s=S.settings;s.my=s.my.filter(x=>x.id!==id);s.fav=s.fav.filter(x=>x!==id);touch("settings")});
    renderSheet(); return}
  if(a==="cbedit"){openSheet("combo",v);return}
  if(a==="cdq"){const it=cdr&&cdr.items[+v]; if(it){it.q=Math.min(20,Math.max(0.5,r1((parseFloat(it.q)||0)+ +b.dataset.d)));shErr="";renderSheet()} return}
  if(a==="cddel"){ if(cdr){cdr.items.splice(+v,1);renderSheet()} return}
  if(a==="cbsheetsave"){ if(!cdr) return; const nm=String(cdr.n).trim().slice(0,20);
    shErr=!nm?"给组合起个名字":!cdr.items.length?"组合里至少留一样食物，或者直接删除组合":"";
    if(shErr){renderSheet();return}
    cdr.n=nm; cdr.items.forEach(it=>{it.q=Math.min(20,Math.max(0.1,r1(parseFloat(it.q)||0)))});
    const cs=S.settings.combos, i=cs.findIndex(x=>x.id===cdr.id); if(i>=0){cs[i]=cdr;touch("settings")}
    closeSheet(); toast(i>=0?"已保存":"这个组合已经不存在了"); return}
  if(a==="cbsheetdel"){ if(!cdr) return; const id=cdr.id;
    withUndo("settings","已删除组合",()=>{S.settings.combos=S.settings.combos.filter(x=>x.id!==id);touch("settings")}); closeSheet(); return}
  if(a==="drset"){const k=b.dataset.k; shErr="";
    if(k==="fast") dr.fast=v==="true"; else if(k==="fsel") dr.fsel=v; else setPath(k,v);
    if(k==="pf.n") dr.plan=planFor(+v);
    renderSheet();return}
  if(a==="obprev"){step=Math.max(0,step-1);shErr="";renderSheet();return}
  if(a==="obnext"){const pf=dr.pf; shErr="";
    if(step===0){ if(pf.sex!=="f"&&pf.sex!=="m") shErr="请选择性别"; else {const e=pfError(Object.assign({},pf,{w:60,goal:""})); if(e) shErr=e} }
    else if(step>=1){ shErr=pfError(pf) }
    if(shErr){renderSheet();return}
    if(step<3){ if(step===2){dr.fast=dr.fsel!=="none"; const w=dr.fsel==="1410"?["09:30","19:30"]:["11:30","19:30"]; dr.win={A:w.slice(),B:w.slice(),C:w.slice()}} step++; renderSheet(); return }
    applyDraft(true); closeSheet(); meal=autoMeal(); render(); toast("设置完成，开始记录吧"); return}
  if(a==="shsave"){const pf=dr.pf; shErr=pf.custom?"":pfError(pf);
    if(!shErr&&dr.fast) S.settings.states.forEach(k=>{ if(!(mins(dr.win[k][1])-mins(dr.win[k][0])>=120)) shErr="进食窗口的结束时间要比开始时间晚至少 2 小时" });
    if(shErr){renderSheet();const e=document.getElementById("sh-err");if(e)e.scrollIntoView({block:"center"});return}
    applyDraft(false); closeSheet(); render(); toast("已保存"); return}
  if(a==="export"){exportData();renderSheetKeepIO();return}
  if(a==="restore"){restoreData();return}
  if(a==="unrestore"){unrestore();return}

  if(a==="prev"||a==="next"){ if(a==="prev") cur=addDays(cur,-1); else if(cur<addDays(today(),7)) cur=addDays(cur,1);
    meal=cur===today()?autoMeal():1; qEdit=tEdit=cbDraft=null }
  else if(a==="state"){mut(cur,d=>{d.state=v})}
  else if(a==="meal"){meal=+v} else if(a==="cat"){cat=v;favEdit=false}
  else if(a==="add"){const f=findFood(v);if(!f)return;addFood(f,1,meal,{live:true});toast("已记录 "+f.n);cu.q=""}
  else if(a==="qedit"){qEdit=v;tEdit=null}
  else if(a==="mtime"){tEdit=+v;qEdit=null}
  else if(a==="favedit"){favEdit=!favEdit}
  else if(a==="unfav"){withUndo("settings","已取消收藏",()=>{S.settings.fav=S.settings.fav.filter(x=>x!==v);touch("settings")})}
  else if(a==="cbdel"){withUndo("settings","已删除组合",()=>{S.settings.combos=S.settings.combos.filter(x=>x.id!==v);touch("settings")})}
  else if(a==="cbadd"){const cb=S.settings.combos.find(x=>x.id===v); if(!cb) return;
    withUndo(cur,"已记入「"+cb.n+"」",()=>cb.items.forEach(it=>addFood({id:it.fid||("cbi-"+uid()),n:it.n,p:it.p,c:it.c,f:it.f,k:it.k,s:it.s},it.q,meal,{live:true})))}
  else if(a==="cbnew"){const es=dayOf(cur).entries.filter(e=>e.m===+v); if(es.length<2) return;
    cbDraft={m:+v,n:es.slice(0,2).map(e=>e.n).join(" + ").slice(0,20)}}
  else if(a==="cbcancel"){cbDraft=null}
  else if(a==="cbsave"){cbSave()}
  else if(a==="inc"||a==="dec"){const e0=dayOf(cur).entries.find(x=>x.id===v); if(!e0) return;
    const step=()=>mut(cur,d=>{const e=d.entries.find(x=>x.id===v);e.q=r1(e.q+(a==="inc"?0.5:-0.5));if(e.q<=0)d.entries=d.entries.filter(x=>x.id!==v)});
    if(a==="dec"&&r1(e0.q-0.5)<=0) withUndo(cur,"已删除 "+e0.n,step); else step()}
  else if(a==="clear"){ if(dayOf(cur).entries.length) withUndo(cur,"已清空"+dayLabel()+"的记录",()=>mut(cur,d=>{d.entries=[]})) }
  else if(a==="tpl"){withUndo(cur,"已填入，按实际增减",()=>tplOf(cur).forEach(m=>m[3].forEach(it=>addFood(FBY[it[0]],it[1],m[1]))))}
  else if(a==="copyy"){const yd=S.days[addDays(cur,-1)]; if(yd) withUndo(cur,"已复制前一天的记录",()=>mut(cur,d=>{d.entries=yd.entries.map(e=>{const x=Object.assign({},e,{id:uid()});delete x.t;return x})}))}
  else if(a==="est"){estimate();return}
  else if(a==="cuopen"){openManual();return}
  else if(a==="cuclose"){cu=cuBlank()}
  else if(a==="cucat"){cu.cat=v;cu.err=""}
  else if(a==="custom"){const nm=String(cu.n).trim().slice(0,40),g=x=>Math.max(0,parseFloat(x)||0);
    const p=g(cu.p),c=g(cu.c),f=g(cu.f),k=String(cu.k).trim()===""?null:r0(g(cu.k));
    cu.err=!nm?"请填写名称":!CAT_IDS.includes(cu.cat)?"请选择分类":!(p+c+f+(k||0))?"填上热量，或至少一项克数":"";
    if(!cu.err){const st=S.settings; let item=st.my.find(x=>x.n===nm);
      if(!item){item={id:"my-"+uid(),n:nm};st.my.unshift(item)}
      item.p=p;item.c=c;item.f=f;item.cat=cu.cat;item.s=cu.cat==="sweet"?1:0; if(k!=null)item.k=k; else delete item.k;
      const fv=cu.fav; if(fv&&!st.fav.includes(item.id)) st.fav.unshift(item.id);
      capMy(); touch("settings");
      addFood(item,1,meal,{live:true});cu=cuBlank();toast(fv?"已记录，已加入常吃":"已记录，已存入我的食物")}}
  else if(a==="water"){mut(cur,d=>{d.water=Math.max(0,Math.min(16,(d.water||0)+ +v))})}
  else if(a==="hz"){hz={id:hz.id===v?null:v,q:1}} else if(a==="hzq"){hz.q=Math.max(0.5,r1(hz.q+ +v))}
  else if(a==="hzclear"){hz={id:null,q:1}}
  else if(a==="hzg"){hzg=v}
  else if(a==="hzadd"){const f=hz.id?findFood(hz.id):null, q=hz.q;if(f){hz={id:null,q:1};withUndo(cur,"已记入"+dayLabel(),()=>addFood(f,q,4,{live:true}))}}
  else if(a==="lift"||a==="cardio"){mut(cur,d=>{d[a]=!d[a]})}
  else if(a==="syncw"){const pf=S.settings.profile, a1=avgW(weightSeries(),0,7); if(pf&&a1!=null){pf.w=r1(a1); if(!pf.custom&&!pfError(pf)){const r=compute(pf);S.settings.t={train:r.train,rest:r.rest}} touch("settings"); toast(pf.custom?"档案体重已更新":"已按新体重重新计算目标")}}
  else if(a==="copyai"){copyText(aiBrief(),"已复制，粘贴给 AI 即可","io2");return}
  render();
});
function renderSheetKeepIO(){const io=document.getElementById("io"),v=io?io.value:"";renderSheet();const n=document.getElementById("io");if(n)n.value=v}
document.addEventListener("input",ev=>{const el=ev.target;
  if(el.id==="cu-q"){cu.q=el.value; if(!ev.isComposing) renderSR(); return}   // 输入法组字中不搜索，compositionend 时再搜
  const m=/^cu-([npcfk])$/.exec(el.id||""); if(m){cu[m[1]]=el.value;const k=document.getElementById("cu-k");if(k)k.placeholder=cuAuto();return}
  if(el.id==="cb-n"){ if(cbDraft) cbDraft.n=el.value; return}
  if(el.id==="cd-n"){ if(cdr) cdr.n=el.value; return}
  if(el.dataset.cdq!=null){ if(cdr&&cdr.items[+el.dataset.cdq]){cdr.items[+el.dataset.cdq].q=el.value;const x=document.getElementById("cd-sum");if(x)x.textContent=cdSum()} return}
  if(el.id==="fq"){fq=el.value;const x=document.getElementById("fl");if(x)x.innerHTML=flHTML();return}
  if(el.dataset.fe){ if(fe) fe[el.dataset.fe]=el.value; return}
  if(el.dataset.dr&&dr){setPath(el.dataset.dr,el.value);const p=document.getElementById("dr-prev");if(p)p.innerHTML=prevHTML()}
});
document.addEventListener("compositionend",ev=>{const el=ev.target; if(el.id==="cu-q"){cu.q=el.value;renderSR()} });
document.addEventListener("keydown",ev=>{ if(ev.key!=="Enter"||ev.isComposing) return; const el=ev.target;
  if(el.id==="cu-q"){ev.preventDefault(); if(!cu.q.trim()) return;
    if(searchNow().length) el.blur(); else if(sampleFn) estimate(); else openManual()}
  else if(el.id==="q-in"){ev.preventDefault();commitQ(el)}
  else if(el.id==="cb-n"){ev.preventDefault();cbSave();render()} });
/* 失焦：份量输入框保存；时间输入框结束编辑 */
document.addEventListener("focusout",ev=>{const el=ev.target;
  if(el.id==="q-in") commitQ(el,true);
  else if(el.id==="mt-in"&&tEdit!=null){tEdit=null;laterRender()} });
/* 点搜索结果里的 ☆ 时不让输入框失焦 */
document.addEventListener("mousedown",ev=>{ if(ev.target.closest&&ev.target.closest('#sr [data-act="fav"]')) ev.preventDefault() });
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.id==="cu-fav"){cu.fav=el.checked;return}
  if(el.id==="mt-in"){ if(tEdit==null) return; const m=tEdit, ok=/^\d\d:\d\d/.test(el.value), t=ok?mins(el.value.slice(0,5)):null;
    if(dayOf(cur).entries.some(e=>e.m===m)) mut(cur,d=>{d.entries.forEach(e=>{ if(e.m===m){ if(ok) e.t=t; else delete e.t } })}); return}
  if(el.id==="dr-spread"&&dr){dr.spread=el.checked;return}
  if(el.dataset.drc&&dr){dr.pf.custom=el.checked; if(el.checked&&!pfError(dr.pf)){const r=compute(dr.pf);dr.t={train:r.train,rest:r.rest}} renderSheet();return}
  if(el.id==="bkfile"&&el.files&&el.files[0]){const fr=new FileReader();fr.onload=()=>{const io=document.getElementById("io");if(io){io.value=String(fr.result||"");armed=false;toast("已读取文件，点“恢复数据”")}};fr.readAsText(el.files[0]);return}
  if(el.dataset.chg){const k=el.dataset.chg;
    if(k==="note"){mut(cur,d=>{d.note=el.value.slice(0,2000)});return}
    const n=parseFloat(el.value); mut(cur,d=>{if(n>0)d[k]=r1(n);else delete d[k]}); render()}
});
function rollDay(){ const td=today(); if(td===lastToday) return;
  if(cur===lastToday) cur=td; lastToday=td; meal=cur===td?autoMeal():1; render() }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) rollDay() });
setInterval(()=>{ rollDay(); if(tab!=="today"||cur!==today()) return; const p=document.getElementById("winpill"); if(!p) return;
  const st=stOf(dayOf(cur)), ws=winStatus(st,cur); if(ws.off) return; p.textContent=ws.txt; p.className="pill "+ws.cls },30000);

meal=autoMeal();
render();
if(!onboarded()) openSheet("onb");
initCloud();
})();
</script>
